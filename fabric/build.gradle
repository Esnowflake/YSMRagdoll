plugins {
    id 'fabric-loom' version '1.11.8'
}

def repositoryRoot = rootDir.parentFile
def sharedProperties = new Properties()
file("${repositoryRoot}/gradle.properties").withInputStream { sharedProperties.load(it) }
def minecraftVersion = findProperty('target_mc') ?: '1.20.1'
def variants = [
    '1.20.1': [java: 17, api: '0.92.12+1.20.1', config: 'v8.0.3-1.20.1-Fabric',
               registry: 'com.elfmcys.yesstevemodel.oOOOoOO0o0O0o0OOo0O0OoOO',
               mesh: 'com.elfmcys.yesstevemodel.oo0o0o0O0o0o00OOOOOooOOo'],
    '1.21.1': [java: 21, api: '0.116.17+1.21.1', config: 'v21.1.6-1.21.1-Fabric',
               registry: 'com.elfmcys.yesstevemodel.oOo000oO0oo0oOOo0Oo0oO0o',
               mesh: 'com.elfmcys.yesstevemodel.o0oOOOOooOOo0OOo00oo00O0']
]
if (!variants.containsKey(minecraftVersion)) {
    throw new GradleException("Unsupported Fabric target: ${minecraftVersion}")
}
def variant = variants[minecraftVersion]
group = sharedProperties.mod_group_id
version = findProperty('mod_version') ?: sharedProperties.mod_version
base.archivesName = "ysmragdoll-${minecraftVersion}-fabric"
layout.buildDirectory = file("build/${minecraftVersion}")
java.toolchain.languageVersion = JavaLanguageVersion.of(variant.java)

repositories {
    mavenCentral()
    maven { url = 'https://api.modrinth.com/maven' }
}

def openYsmJar = file("${repositoryRoot}/libs/openysm-2.6.5-forge+mc1.20.1.jar")
if (!openYsmJar.isFile()) {
    throw new GradleException("Missing parser dependency: ${openYsmJar}")
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraftVersion}"
    mappings loom.officialMojangMappings()
    modImplementation 'net.fabricmc:fabric-loader:0.16.14'
    modImplementation "net.fabricmc.fabric-api:fabric-api:${variant.api}"
    modImplementation "maven.modrinth:forge-config-api-port:${variant.config}"
    include "maven.modrinth:forge-config-api-port:${variant.config}"
    compileOnly files(openYsmJar)
    implementation('cz.advel.jbullet:jbullet:20101010-1') { transitive = false }
    include('cz.advel.jbullet:jbullet:20101010-1') { transitive = false }
    implementation 'javax.vecmath:vecmath:1.5.2'
    include 'javax.vecmath:vecmath:1.5.2'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'net.fabricmc:fabric-loader-junit:0.16.14'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    if (findProperty('ysm_smoke') == 'true') {
        modRuntimeOnly files("${repositoryRoot}/libs/compatibility/ysm-2.6.5-fabric+mc${minecraftVersion}-release.jar")
    }
    if (minecraftVersion == '1.21.1') {
        // Modrinth's generated POM does not expose the port's nested libraries.
        implementation 'com.electronwill.night-config:core:3.8.0'
        implementation 'com.electronwill.night-config:toml:3.8.0'
    }
}

def sharedJava = file("${repositoryRoot}/src/main/java")
def platformFiles = [
    'OpenYsmRagdollMod.java', 'ClientBootstrap.java', 'ClientRagdollEvents.java',
    'RagdollKeyMappings.java', 'RagdollNetwork.java', 'PlayerDeathSnapshot.java',
    'ExplosionImpulseSnapshot.java', 'ServerDeathEvents.java', 'ServerExplosionEvents.java',
    'YsmPlatform.java', 'Ysm265MeshCaptureMixin.java'
]
if (minecraftVersion == '1.21.1') {
    platformFiles += ['ClientVersion.java', 'DiscardingVertexConsumer.java', 'VersionedScreen.java']
}
sourceSets {
    main {
        java {
            srcDirs = [sharedJava, 'src/main/java', "src/${minecraftVersion}/java"]
            exclude { element ->
                element.file.toPath().startsWith(sharedJava.toPath()) &&
                    platformFiles.contains(element.file.name)
            }
        }
        resources {
            srcDirs = ["${repositoryRoot}/src/main/resources", 'src/main/resources']
            exclude 'META-INF/mods.toml', 'ysmragdoll.mixins.json'
        }
    }
    test {
        java {
            srcDirs = ["${repositoryRoot}/src/test/java", 'src/test/java', "src/${minecraftVersion}/test"]
            if (minecraftVersion == '1.21.1') {
                exclude { e -> e.file.name == 'CaptureBufferTest.java' &&
                    e.file.toPath().startsWith(file("${repositoryRoot}/src/test/java").toPath()) }
            }
        }
    }
}

loom {
    mixin { defaultRefmapName = 'ysmragdoll.refmap.json' }
    runs {
        client { runDir = "run/${minecraftVersion}/client" }
        server { runDir = "run/${minecraftVersion}/server" }
    }
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
test {
    useJUnitPlatform()
    systemProperty 'ysmragdoll.compatibilityTest', findProperty('ysm_smoke') ?: 'false'
    afterSuite { descriptor, result ->
        if (!descriptor.parent && result.testCount == 0) {
            throw new GradleException('No tests executed')
        }
    }
}
processResources {
    inputs.property 'modVersion', project.version
    inputs.property 'minecraftVersion', minecraftVersion
    inputs.property 'javaVersion', variant.java
    filesMatching('fabric.mod.json') {
        expand modVersion: project.version, minecraftVersion: minecraftVersion,
                javaVersion: variant.java
    }
    from("${repositoryRoot}/LICENSE") {
        into 'META-INF/licenses'
        rename { 'YSMRAGDOLL-LICENSE.txt' }
    }
    from("${repositoryRoot}/licenses/OpenYSM-LICENSE.txt") {
        into 'META-INF/licenses'
        rename { 'OpenYSM-LICENSE.txt' }
    }
    doLast {
        file("${destinationDir}/ysmragdoll-platform.properties").text =
                "registry=${variant.registry}\nmesh=${variant.mesh}\n"
        def pack = new groovy.json.JsonSlurper().parse(file("${destinationDir}/pack.mcmeta"))
        pack.pack.pack_format = minecraftVersion == '1.21.1' ? 34 : 15
        file("${destinationDir}/pack.mcmeta").text = groovy.json.JsonOutput.prettyPrint(
                groovy.json.JsonOutput.toJson(pack))
    }
}

def parserDir = layout.buildDirectory.dir('generated/openysmRuntime')
def extractParser = tasks.register('extractOpenYsmRuntime', Sync) {
    into parserDir
    from(zipTree(openYsmJar)) {
        include 'rip/ysm/algorithms/CityHash*.class', 'rip/ysm/algorithms/MT19937*.class'
        include 'rip/ysm/algorithms/ChaCha20Base*.class', 'rip/ysm/algorithms/XChaCha20*.class'
        include 'rip/ysm/zstd/**/*.class', 'rip/ysm/security/YSMByteBuf*.class'
        include 'com/elfmcys/yesstevemodel/resource/YSMBinaryDeserializer*.class'
        include 'com/elfmcys/yesstevemodel/resource/pojo/RawYsmModel*.class'
    }
}
sourceSets.main.output.dir(parserDir, builtBy: extractParser)
jar {
    manifest.attributes 'Implementation-Version': project.version
}
remapJar { archiveClassifier = 'all' }
